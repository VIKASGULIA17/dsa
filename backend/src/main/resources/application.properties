spring.application.name=dsahub-backend

# Server Configuration
server.port=8080
server.servlet.context-path=/api

# Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/dsahub}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:dsahub}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:dsahub123}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
jwt.secret=${JWT_SECRET:default-secret-key-for-development-only-change-in-production-must-be-very-long}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

# Admin User Configuration
admin.email=${ADMIN_EMAIL:admin@dsahub.com}
admin.password=${ADMIN_PASSWORD:Admin@123}

# Logging
logging.level.com.dsahub.backend=DEBUG
logging.level.org.springframework.security=DEBUG
